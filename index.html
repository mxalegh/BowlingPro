<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowling Pro - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">
        <h1>Bowling Pro</h1>
        <h2>Crear cuenta</h2>

        <form id="formularioRegistro">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>

            <label for="confirmarContrasena">Confirmar contraseña</label>
            <input type="password" id="confirmarContrasena" placeholder="Confirma tu contraseña" required>

            <button type="submit">Registrarse</button>

            <p id="mensaje"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
